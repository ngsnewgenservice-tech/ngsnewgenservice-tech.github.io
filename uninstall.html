<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PolySubs Feedback</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .reasons { display: grid; gap: 10px; margin: 20px 0; }
    .reason { text-align: start; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
    .reason.on { border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 35%, transparent); }
    textarea { width: 100%; min-height: 100px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
    .small { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><a class="logo" href="./"><img src="assets/icon.svg" alt="">PolySubs</a></div></header>
  <main class="legal">
    <h1 id="t_title"></h1>
    <p class="date" id="t_sub"></p>
    <div class="reasons" id="reasons"></div>
    <textarea id="more"></textarea>
    <p><button class="btn primary" id="send" type="button"></button></p>
    <p class="small" id="t_note"></p>
    <p><a href="install.html" id="t_back"></a></p>
  </main>
  <script>
  (function () {
    var T = {
      en: { title: "Sorry to see you go", sub: "Why did you remove PolySubs? One click helps us improve it.", r: ["It didn't work on my videos", "The translations weren't good enough", "It was too complicated", "I need more free features", "It was too expensive", "I don't need it anymore", "Something else"], more: "Anything else you'd like to tell us? (optional)", send: "Send feedback", note: "This opens your email app with your answer ready to send.", back: "Changed your mind? Install PolySubs again" },
      ar: { title: "يؤسفنا رحيلك", sub: "لماذا حذفت PolySubs؟ نقرة واحدة تساعدنا على تحسينها.", r: ["لم تعمل على فيديوهاتي", "الترجمة لم تكن جيدة بما يكفي", "كانت معقدة", "أحتاج ميزات مجانية أكثر", "السعر مرتفع", "لم أعد أحتاجها", "سبب آخر"], more: "هل تريد إخبارنا بشيء آخر؟ (اختياري)", send: "إرسال الرأي", note: "سيفتح تطبيق البريد ورسالتك جاهزة للإرسال.", back: "غيّرت رأيك؟ ثبّت PolySubs من جديد" },
      es: { title: "Sentimos que te vayas", sub: "¿Por qué eliminaste PolySubs? Un clic nos ayuda a mejorar.", r: ["No funcionó en mis videos", "Las traducciones no eran buenas", "Era demasiado complicado", "Necesito más funciones gratis", "Era demasiado caro", "Ya no lo necesito", "Otro motivo"], more: "¿Algo más que quieras contarnos? (opcional)", send: "Enviar opinión", note: "Se abrirá tu correo con la respuesta lista para enviar.", back: "¿Cambiaste de idea? Instala PolySubs de nuevo" },
      fr: { title: "Désolés de vous voir partir", sub: "Pourquoi avez-vous retiré PolySubs ? Un clic nous aide à l'améliorer.", r: ["Ça ne marchait pas sur mes vidéos", "Les traductions n'étaient pas assez bonnes", "C'était trop compliqué", "J'ai besoin de plus de fonctions gratuites", "C'était trop cher", "Je n'en ai plus besoin", "Autre raison"], more: "Autre chose à nous dire ? (facultatif)", send: "Envoyer l'avis", note: "Votre messagerie s'ouvrira avec la réponse prête à envoyer.", back: "Vous avez changé d'avis ? Réinstallez PolySubs" },
      pt: { title: "Que pena que você vai embora", sub: "Por que você removeu o PolySubs? Um clique nos ajuda a melhorar.", r: ["Não funcionou nos meus vídeos", "As traduções não eram boas", "Era complicado demais", "Preciso de mais recursos grátis", "Era caro demais", "Não preciso mais", "Outro motivo"], more: "Quer nos contar mais alguma coisa? (opcional)", send: "Enviar opinião", note: "Seu app de e-mail abrirá com a resposta pronta para enviar.", back: "Mudou de ideia? Instale o PolySubs de novo" },
      zh: { title: "很遗憾看到你离开", sub: "你为什么移除了 PolySubs？点一下就能帮助我们改进。", r: ["在我的视频上无法使用", "翻译质量不够好", "太复杂了", "需要更多免费功能", "价格太贵", "不再需要了", "其他原因"], more: "还有什么想告诉我们的吗？（可选）", send: "发送反馈", note: "将打开你的邮件应用，内容已准备好发送。", back: "改变主意了？重新安装 PolySubs" },
      hi: { title: "आपको जाते देख दुख है", sub: "आपने PolySubs क्यों हटाया? एक क्लिक हमें बेहतर बनाने में मदद करेगा।", r: ["मेरे वीडियो पर काम नहीं किया", "अनुवाद अच्छे नहीं थे", "बहुत जटिल था", "मुझे और मुफ़्त सुविधाएँ चाहिए", "बहुत महँगा था", "अब ज़रूरत नहीं है", "कोई और कारण"], more: "कुछ और बताना चाहेंगे? (वैकल्पिक)", send: "राय भेजें", note: "आपका ईमेल ऐप जवाब के साथ खुलेगा।", back: "मन बदल गया? PolySubs फिर से इंस्टॉल करें" },
      ru: { title: "Жаль, что вы уходите", sub: "Почему вы удалили PolySubs? Один клик поможет нам стать лучше.", r: ["Не работало на моих видео", "Переводы были недостаточно хорошими", "Слишком сложно", "Нужно больше бесплатных функций", "Слишком дорого", "Больше не нужно", "Другая причина"], more: "Хотите что-то добавить? (необязательно)", send: "Отправить отзыв", note: "Откроется почта с готовым ответом.", back: "Передумали? Установите PolySubs снова" },
      id: { title: "Sayang sekali kamu pergi", sub: "Kenapa kamu menghapus PolySubs? Satu klik membantu kami jadi lebih baik.", r: ["Tidak berfungsi di videoku", "Terjemahannya kurang bagus", "Terlalu rumit", "Butuh lebih banyak fitur gratis", "Terlalu mahal", "Sudah tidak butuh", "Alasan lain"], more: "Ada hal lain yang ingin disampaikan? (opsional)", send: "Kirim masukan", note: "Aplikasi email akan terbuka dengan jawaban siap dikirim.", back: "Berubah pikiran? Pasang PolySubs lagi" },
      de: { title: "Schade, dass du gehst", sub: "Warum hast du PolySubs entfernt? Ein Klick hilft uns, besser zu werden.", r: ["Es funktionierte nicht bei meinen Videos", "Die Übersetzungen waren nicht gut genug", "Zu kompliziert", "Ich brauche mehr kostenlose Funktionen", "Zu teuer", "Ich brauche es nicht mehr", "Anderer Grund"], more: "Möchtest du uns noch etwas sagen? (optional)", send: "Feedback senden", note: "Dein E-Mail-Programm öffnet sich mit der fertigen Antwort.", back: "Umentschieden? PolySubs erneut installieren" }
    };
    var q = new URLSearchParams(location.search);
    var lang = (q.get("ui") || navigator.language || "en").toLowerCase().split("-")[0];
    if (!T[lang]) lang = "en";
    var t = T[lang], picked = null;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.getElementById("t_title").textContent = t.title;
    document.getElementById("t_sub").textContent = t.sub;
    document.getElementById("more").placeholder = t.more;
    document.getElementById("send").textContent = t.send;
    document.getElementById("t_note").textContent = t.note;
    document.getElementById("t_back").textContent = t.back;
    var box = document.getElementById("reasons");
    t.r.forEach(function (r, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "reason"; b.textContent = r;
      b.onclick = function () {
        picked = i;
        box.querySelectorAll(".reason").forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
      };
      box.appendChild(b);
    });
    document.getElementById("send").onclick = function () {
      var reason = picked == null ? "-" : T.en.r[picked] + (lang !== "en" ? " / " + t.r[picked] : "");
      var body = "Reason: " + reason + "\nVersion: " + (q.get("v") || "?") + "\nLanguage: " + lang + "\n\n" + document.getElementById("more").value;
      location.href = "mailto:ngs.newgenservice@gmail.com?subject=" + encodeURIComponent("PolySubs uninstall feedback") + "&body=" + encodeURIComponent(body);
    };
  })();
  </script>
</body>
</html>
